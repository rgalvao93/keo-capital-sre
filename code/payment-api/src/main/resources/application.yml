server:
  port: 8080

spring:
  application:
    name: payment-api
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/keo-capital}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      datadog:
        enabled: true
        api-key: 83110229896b20a2d6b8dfe739a912af
        step: 10s
    tags:
      service: payment-api
      env: ${DD_ENV:dev}

logging:
  level:
    com.keocapital: INFO