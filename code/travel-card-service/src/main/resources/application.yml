server:
  port: 8082

spring:
  application:
    name: travel-card-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/keo-capital}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  datadog:
    metrics:
      export:
        enabled: true
        api-key: ${DD_API_KEY:}
        step: 10s
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      service: travel-card-service
      env: ${DD_ENV:dev}

logging:
  level:
    com.keocapital: INFO
