name: CI - Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Spotless format check
        run: mvn -B spotless:check

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/target/surefire-reports/*.txt'

      - name: Notify Datadog of CI result
        if: always() && secrets.DD_API_KEY != ''
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          STATUS="${{ job.status }}"
          curl -s -X POST "https://api.datadoghq.com/api/v1/events" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${DD_API_KEY}" \
            -d "{
              \"title\": \"CI pipeline ${STATUS}\",
              \"text\": \"Build/test on ${{ github.ref }}. Commit: ${{ github.sha }}\",
              \"tags\": [\"source:github-actions\",\"ci:${STATUS}\"],
              \"alert_type\": \"${{ job.status == 'success' && 'info' || 'error' }}\"
            }"

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform
      - name: Terraform Init
        run: terraform init -backend=false -input=false
        working-directory: terraform
      - name: Terraform Validate
        run: terraform validate
        working-directory: terraform

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          for dir in code/*/; do
            if [ -f "$dir/Dockerfile" ]; then
              svc=$(basename "$dir")
              echo "Building $svc"
              docker build -t "keo-capital/$svc:latest" -f "$dir/Dockerfile" .
            fi
          done

  terraform:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform Init
        run: terraform init
        working-directory: terraform
      - name: Terraform Plan
        run: terraform plan
        working-directory: terraform
        env:
          TF_VAR_datadog_api_key: ${{ secrets.DATADOG_API_KEY }}
          TF_VAR_datadog_app_key: ${{ secrets.DATADOG_APP_KEY }}