name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push images
        run: |
          for dir in code/*/; do
            if [ -f "$dir/Dockerfile" ]; then
              name=$(basename "$dir")
              docker build -t "${{ secrets.REGISTRY_URL }}/keo-capital/$name:latest" "$dir"
              docker push "${{ secrets.REGISTRY_URL }}/keo-capital/$name:latest"
            fi
          done

      - name: Deploy with docker-compose
        run: docker compose up -d

      - name: Notify Datadog of deployment
        if: success()
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          curl -s -X POST "https://api.datadoghq.com/api/v1/events" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: ${DD_API_KEY}" \
            -d '{
              "title": "Keo Capital deployment",
              "text": "Deploy completed on main branch. Commit: ${{ github.sha }}",
              "tags": ["source:github-actions","service:keo-capital","env:prod"],
              "alert_type": "info"
            }'